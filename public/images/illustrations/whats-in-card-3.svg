<svg xmlns="http://www.w3.org/2000/svg" width="476" height="224" viewBox="0 0 476 224" fill="none">
  <rect width="476" height="224" fill="#141126"/>
  <!-- re-engagement: notification + returning shopper -->
  <rect x="40" y="30" width="396" height="60" rx="12" fill="#2A2450"/>
  <circle cx="80" cy="60" r="20" fill="#065CF5"/>
  <path d="M70 60 l7 7 13-14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="115" y="56" font-family="Arial" font-size="17" font-weight="700" fill="#fff">Shopper voltou</text>
  <text x="115" y="78" font-family="Arial" font-size="14" font-weight="500" fill="#8B87B8">Reengajado após 30s</text>
  <!-- returning arrow -->
  <path d="M120 150 h180" stroke="#8B87B8" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
  <path d="M300 150 l-20 -12 v24 z" fill="#16A34A"/>
  <!-- product -->
  <rect x="330" y="120" width="100" height="80" rx="12" fill="#2A2450"/>
  <rect x="346" y="136" width="68" height="30" rx="8" fill="#065CF5"/>
  <rect x="346" y="174" width="50" height="8" rx="4" fill="#8B87B8"/>
  <text x="40" y="200" font-family="Arial" font-size="15" font-weight="700" fill="#16A34A">✓ Venda recuperada</text>
</svg>
